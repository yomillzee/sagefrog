<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing — Northwind Consulting</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f172a;background:#f4f6f9}
  header{background:#0a2540;color:#fff;padding:16px 24px}
  main{max-width:900px;margin:0 auto;padding:56px 24px}
  h1{letter-spacing:-.5px}
  .tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:24px}
  .tier{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:24px}
  .tier .price{font-size:32px;font-weight:700;margin:8px 0}
  #consent-banner{position:fixed;left:16px;right:16px;bottom:16px;max-width:720px;margin:0 auto;background:#fff;
    border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 12px 40px rgba(10,37,64,.18);padding:20px 22px;
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;z-index:9999}
  #consent-banner p{margin:0;font-size:14px;color:#334155;flex:1 1 320px}
  #consent-banner button{border-radius:9px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid transparent}
  #reject-all{background:#fff;border-color:#cbd5e1;color:#0f172a}
  #accept-all{background:#0b5cab;color:#fff}
</style>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent','default',{ad_storage:'denied',analytics_storage:'denied',
    ad_user_data:'denied',ad_personalization:'denied',wait_for_update:500});
  gtag('js', new Date()); gtag('config','G-DEMO12345');
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DEMO12345"></script>
<script>
function rid(n){var s='';while(s.length<n)s+=Math.random().toString(36).slice(2);return s.slice(0,n);}
function gaHit(granted){
  var gcs=granted?'G111':'G100';
  var url='https://www.google-analytics.com/g/collect?v=2&tid=G-DEMO12345&gcs='+gcs+'&dl='+encodeURIComponent(location.href)+'&en=page_view';
  if(granted){var cid=Math.floor(Math.random()*1e9)+'.'+Math.floor(Date.now()/1000);
    document.cookie='_ga=GA1.1.'+cid+';path=/;max-age=63072000';
    document.cookie='_ga_DEMO12345=GS1.1.'+Date.now()+'.1.1;path=/;max-age=63072000';url+='&cid='+cid;}
  new Image().src=url;
}
// This page is well-behaved: NO pre-consent identifier leak. Only the essential
// cookie + a Consent Mode cookieless ping fire before a choice is made.
document.cookie='nw_session='+rid(24)+';path=/';
gaHit(false);
function grantAll(){gtag('consent','update',{ad_storage:'granted',analytics_storage:'granted',ad_user_data:'granted',ad_personalization:'granted'});gaHit(true);
  document.cookie='li_fat_id='+rid(20)+';path=/';new Image().src='https://px.ads.linkedin.com/collect?pid=987654&fmt=gif';}
function denyAll(){gtag('consent','update',{ad_storage:'denied',analytics_storage:'denied',ad_user_data:'denied',ad_personalization:'denied'});gaHit(false);}
</script>
</head>
<body>
<header><strong>Northwind Consulting</strong></header>
<main>
  <h1>Simple, transparent pricing</h1>
  <p>Plans that scale with your pipeline goals.</p>
  <div class="tiers">
    <div class="tier"><h3>Starter</h3><div class="price">$4k<span style="font-size:14px">/mo</span></div><p>Paid search foundations.</p></div>
    <div class="tier"><h3>Growth</h3><div class="price">$9k<span style="font-size:14px">/mo</span></div><p>Full-funnel across channels.</p></div>
    <div class="tier"><h3>Scale</h3><div class="price">$18k<span style="font-size:14px">/mo</span></div><p>Dedicated pod + analytics.</p></div>
  </div>
</main>
<div id="consent-banner" role="dialog" aria-label="Cookie consent">
  <p>We use cookies to analyse traffic and personalise advertising.</p>
  <div class="actions">
    <button id="reject-all" data-consent-action="reject" onclick="denyAll();this.closest('#consent-banner').remove();">Reject All</button>
    <button id="accept-all" data-consent-action="accept" onclick="grantAll();this.closest('#consent-banner').remove();">Accept All</button>
  </div>
</div>
</body>
</html>
