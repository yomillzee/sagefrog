# Runtime env for the consent scanner. Best-effort — the scanner no longer
# depends on these propagating to the runtime container (it searches known
# install paths and auto-detects root for --no-sandbox).
[variables]
PLAYWRIGHT_BROWSERS_PATH = "/opt/pw-browsers"
CONSENT_SCANNER_NO_SANDBOX = "1"

[phases.setup]
nixPkgs = ["python3", "gcc"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && python -m pip install --upgrade pip setuptools wheel",
  ". /opt/venv/bin/activate && python -m pip install --index-url https://pypi.org/simple -r requirements.txt",
  # Install the Chromium browser + its OS libraries for the consent scanner.
  # We use Playwright's own `--with-deps`, which picks the correct apt packages
  # for the detected base image (Ubuntu 24.04 renamed several libs with a t64
  # suffix, so a hand-written apt list is fragile). Non-fatal (|| true): if this
  # can't complete at build time the deploy still succeeds and the scanner
  # installs the browser on demand on the first scan.
  ". /opt/venv/bin/activate && PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers python -m playwright install --with-deps chromium || true"
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"
