[variables]
# The consent scanner's Chromium is installed here at build time (see the
# playwright install step below); the app reads this at runtime to locate it.
PLAYWRIGHT_BROWSERS_PATH = "/opt/pw-browsers"
# The container runs as root, where Chromium refuses to start its sandbox — the
# scanner passes --no-sandbox only when this is set.
CONSENT_SCANNER_NO_SANDBOX = "1"

[phases.setup]
nixPkgs = ["python3", "gcc"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && python -m pip install --upgrade pip setuptools wheel",
  ". /opt/venv/bin/activate && python -m pip install --index-url https://pypi.org/simple -r requirements.txt",
  # Consent & Tracking Health scans drive a headless Chromium via Playwright.
  # Install the browser + its OS libraries into a stable, image-persistent path
  # so the scanner finds it at runtime (PLAYWRIGHT_BROWSERS_PATH is also set on
  # the deploy so both build and runtime agree). --with-deps pulls the correct
  # apt packages for the base image. If this ever fails the scan degrades to a
  # clear "browser unavailable" message rather than crashing the app.
  ". /opt/venv/bin/activate && PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers python -m playwright install --with-deps chromium"
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"
