[build]
builder = "nixpacks"

[deploy]
startCommand = "python run_sync_penn.py"
# 11:00 UTC ≈ 6:00 AM US Eastern (standard time)
cronSchedule = "0 11 * * *"
restartPolicyType = "never"
# One-shot worker — no HTTP server; must disable health checks (not /health like sagefrog).
healthcheckPath = ""
healthcheckTimeout = 0
