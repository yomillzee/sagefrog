name: CI

# First CI for the repo. Runs the test suite against a throwaway Postgres (so the
# DATABASE_URL-gated tests actually run instead of skipping) and enforces the
# schema-migration guard. See railway/app/docs/staging-and-ci-proposal.md.
#
# CI never touches production or production data — every job uses an ephemeral,
# synthetic Postgres created for the run.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sagefrog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Ephemeral, synthetic DB — the migration + DB-gated tests run against this.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sagefrog_test
    defaults:
      run:
        working-directory: railway/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: railway/app/requirements.lock
      - name: Install dependencies
        # The lock, so CI tests the exact tree a deploy installs. --require-hashes
        # fails the run if the lock has drifted from requirements.txt rather than
        # quietly resolving something else.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pytest
      - name: Run tests
        # --continue-on-collection-errors: these modules import vendor SDKs at
        # module scope, and without this one bad import aborts collection for all
        # of them — the run goes red with zero results and nothing to read. It
        # still fails the build; it just reports the other ~1,500 tests too.
        run: python -m pytest -q --continue-on-collection-errors

  guard:
    # Fast, no services: keeps schema DDL off read/write paths in migrated modules.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schema-migration guard
        run: bash railway/app/scripts/check_ddl_guard.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        # Config and rationale for the enabled rule set: railway/app/pyproject.toml.
        run: |
          pip install --quiet ruff==0.16.6
          cd railway/app
          ruff check .

      - name: Dependency lock is in sync with requirements.txt
        # Editing requirements.txt without recompiling would leave the lock —
        # the thing actually installed — silently stale. Recompiling here and
        # diffing catches that at review time.
        run: |
          pipx install uv >/dev/null 2>&1 || pip install --quiet uv
          cd railway/app
          uv pip compile requirements.txt \
            --python-version 3.12 --python-platform x86_64-unknown-linux-gnu \
            --generate-hashes --no-header -o /tmp/requirements.lock
          # Compare only the resolved pins, ignoring this repo's header comments.
          grep -v '^#' requirements.lock > /tmp/have.txt
          grep -v '^#' /tmp/requirements.lock > /tmp/want.txt
          diff -u /tmp/have.txt /tmp/want.txt \
            || { echo "::error::requirements.lock is stale — recompile it (see its header)"; exit 1; }
